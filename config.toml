# +EV scanner configuration. Edit freely; CLI flags override these values.
# The Odds API key is NOT stored here - it is read from the ODDS_API_KEY env var.

[scan]
min_ev_pct = 1.0              # only show bets with EV% above this
devig_method = "power"        # "power" (default) or "multiplicative"
kelly_multiplier = 0.25       # quarter Kelly
max_kelly_pct = 5.0           # cap displayed stake (% of bankroll) - safety rail
max_ev_pct = 25.0             # drop anything above this as a likely stale/bad line
markets = ["h2h", "spreads", "totals"]
sports = ["nfl", "ncaaf", "nba", "nhl", "mlb", "wnba"]
skip_live = true              # ignore events that have already started
max_fair_odds_age_min = 30    # ignore sharp prices whose market last_update is older than this

[sharp]
# Fair-odds references, in priority order. Each is de-vigged (power/multiplicative)
# on the exact same line - including Novig, which is an exchange with little or no
# vig, so devigging just removes any residual over/underround.
references = ["pinnacle", "novig"]   # pinnacle = eu region, novig = us_ex region
mode = "priority"             # "priority": first reference with the line (pinnacle, then novig)
                              # "blend":    average de-vigged pinnacle + novig when both exist
                              # CLI: --ref-mode priority|blend
fallback = "consensus"        # if no reference has the exact market/line
# Reference-only books: NEVER evaluated as a target or shown as a bet row
# (Novig is used purely as a fair-odds reference). Enforced in the scanner too.
never_target = ["novig"]
# Per-reference overround cap: an exchange line whose implied probabilities sum
# above this is a wide bid/ask (illiquid), not a price -> skip that reference for
# that line and fall through to the next one. On 2026-10-07 Novig main markets had
# a median implied sum of 1.015 (90th pct 1.047); its props median 1.069 (p90 1.26).
max_implied_sum_by_ref = { novig = 1.05 }
book = "pinnacle"             # legacy single-sharp setting (used only if `references` is absent)
consensus_min_books = 3       # minimum books (excluding the target) for a consensus price
min_implied_sum = 0.97        # reference lines outside this overround band are ignored
max_implied_sum = 1.20        # (filters junk such as 1.01/1.01 quotes on illiquid exchanges)

[api]
odds_format = "decimal"
cache_dir = "cache"
cache_ttl_minutes = 10        # re-use cached odds younger than this (saves credits)
max_credits_per_run = 60      # hard stop so a typo can't burn the monthly quota (CLI: --max-credits)
max_bookmakers_per_call = 10  # 10 bookmakers = 1 "region" for billing
skip_paid_only_books = true   # don't spend a bookmaker slot on paid-plan-only keys

# Target books: where you want to place bets. key = The Odds API bookmaker key.
# covered = false -> not available in The Odds API (kept here for documentation).
